<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Time Capsule</title>
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </head>
    <body>
        <nav>
            <h1 onclick="window.location='/'">TimeCapsule</h1>
        </nav>
        <div class="container">
            <div id="content">
                <form action="javascript:void(0)" method="post">
                    <label for="text_content">Content:</label>
                    <textarea id="text_content" name="content" rows="4" cols="50"></textarea><br>
                    <label for="open_date">Open Date:</label><br>
                    <input type="date" id="open_date" name="open_date"><br>
                    <button type="submit" value="Create Time Capsule" onclick="createTimeCapsule()">
                        Create!
                    </button>
                </form>
                <div id="response" class="hide">
                    <p>Your id: <span id="time_capsule_id"></span></p>
                    <p>Save this id to view your time capsule later!</p>
                    <p class="warn">This id cannot be retrieved again! So make sure to save it somewhere safe.</p>
                </div>
            </div>
        </div>
        <div id="toast" class="hide"></div>
    </body>
</html>
