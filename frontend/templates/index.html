<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Freshers Competition Scores</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page">
        <header class="hero">
            <h1>Freshers Competition Scoreboard</h1>
            <p>Live score updates for all participating programmes.</p>
            <a class="admin-link" href="{{ url_for('admin_panel') }}">Go to Admin Panel</a>
        </header>

        <section class="score-card">
            <table>
                <thead>
                    <tr>
                        <th>Programme</th>
                        <th>Score</th>
                        <th>Last Updated (UTC)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for score in scores %}
                    <tr>
                        <td>{{ score.program_name }}</td>
                        <td>{{ score.score }}</td>
                        <td>{{ score.updated_at }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
