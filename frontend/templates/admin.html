<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scoreboard Admin</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    {% if is_admin %}
    <script defer src="{{ url_for('static', filename='script.js') }}"></script>
    {% endif %}
</head>
<body>
    <div class="page">
        <header class="hero">
            <h1>Admin Panel</h1>
            <p>Edit programme names and scores for the freshers competition.</p>
            <a class="admin-link" href="{{ url_for('scoreboard') }}">Back to Scoreboard</a>
        </header>

        {% if not is_admin %}
        <section class="score-card">
            <form method="post" action="{{ url_for('admin_login') }}">
                <label for="password">Admin Password</label>
                <input id="password" type="password" name="password" required>
                <button class="save-btn" type="submit">Login</button>
                {% if login_error %}
                <p class="toast error">{{ login_error }}</p>
                {% endif %}
            </form>
        </section>
        {% else %}
        <section class="score-card">
            <form method="post" action="{{ url_for('admin_logout') }}">
                <button class="save-btn" type="submit">Logout</button>
            </form>
            <p id="toast" class="toast hidden"></p>
            <table id="admin-table">
                <thead>
                    <tr>
                        <th>Programme Name</th>
                        <th>Score</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for score in scores %}
                    <tr data-id="{{ score.id }}">
                        <td>
                            <input type="text" class="programme" value="{{ score.program_name }}" maxlength="60">
                        </td>
                        <td>
                            <input type="number" class="score" value="{{ score.score }}" min="0">
                        </td>
                        <td>
                            <button class="save-btn" type="button">Save</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>
        {% endif %}
    </div>
</body>
</html>
